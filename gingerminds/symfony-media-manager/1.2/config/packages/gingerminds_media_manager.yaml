# Full reference: bin/console config:dump-reference gingerminds_media_manager
# Documentation: vendor/gingerminds/symfony-media-manager/docs
gingerminds_media_manager:
    # Without configuration the files go to a private local storage (var/storage/media).
    # To store them elsewhere, map disk names to Flysystem storages (config/packages/flysystem.yaml).
    # Keep the storage out of public/: the files are served by GET /api/files/{id}.
    # storage:
    #     default_disk: default
    #     disks:
    #         default: media.storage

    # library:
    #     max_upload_size: 51200     # KB, below the PHP and web server limits

    # basket:
    #     enabled: true
    #     ttl: 30                    # days of a guest basket, 0: forever
